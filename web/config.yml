# Sveltia CMS config for victoriasickness-web — generated by scripts/make_config.py — edit that script, not this file.
# Docs: https://sveltiacms.app/en/docs
app_title: Cia. Victoria Sickness · web
logo:
  src: /victoriasickness-admin/favicon.svg
backend:
  name: github
  repo: ciaVENDAVAL/victoriasickness-web
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: 'Admin: create {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'
site_url: https://ciavendaval.github.io/victoriasickness-web/es/
display_url: https://ciavendaval.github.io/victoriasickness-web/es/
media_folder: source-images
public_folder: /source-images
media_libraries:
  default:
    config:
      slugify_filename: false
      max_file_size: 25000000
editor:
  preview: false
output:
  json:
    indent_size: 1
  omit_empty_optional_fields: true
i18n:
  structure: multiple_folders
  locales:
  - es
  - ca
  - eu
  - en
  - fr
  - it
  - pt
  - de
  default_locale: es
asset_collections:
- name: photos
  label: Fotos (originales)
  media_folder: source-images
  public_folder: /source-images
  icon: photo_library
- name: pdfs
  label: PDFs
  media_folder: static/pdf
  public_folder: /pdf
  icon: picture_as_pdf
singletons:
- name: downloads
  label: 'PDFs: cuál da cada enlace'
  icon: picture_as_pdf
  file: content/downloads.json
  fields:
  - name: invocaciones
    label: Dossier · invocaciones
    widget: object
    collapsed: false
    hint: 'Enlace corto para emails: …/dossier/invocaciones/<idioma>/ — da siempre el PDF elegido aquí. Si un idioma está vacío, se da el castellano. Nombre: VictoriaSickness-Invocaciones_ES_dossier_2027-01.pdf'
    fields:
    - name: es
      label: ES
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: true
    - name: ca
      label: CA
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: eu
      label: EU
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: en
      label: EN
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: fr
      label: FR
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: it
      label: IT
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: pt
      label: PT
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: de
      label: DE
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
  - name: invocaciones-compacto
    label: Dossier · invocaciones-compacto
    widget: object
    collapsed: true
    hint: 'Enlace corto para emails: …/dossier/invocaciones-compacto/<idioma>/ — da siempre el PDF elegido aquí. Si un idioma está vacío, se da el castellano. Nombre: VictoriaSickness-Invocaciones_ES_dossier_2027-01.pdf'
    fields:
    - name: es
      label: ES
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: true
    - name: ca
      label: CA
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: eu
      label: EU
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: en
      label: EN
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: fr
      label: FR
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: it
      label: IT
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: pt
      label: PT
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
    - name: de
      label: DE
      widget: file
      media_folder: /static/pdf
      public_folder: /pdf
      required: false
- name: theme
  label: 'Aspecto: colores y letra'
  icon: palette
  file: content/theme.json
  fields:
  - name: _about
    label: Nota (no tocar)
    widget: hidden
    default: Colours and text font of the website (editable in the admin). Defaults = the original design.
  - name: ink
    label: Fondo oscuro (negro)
    widget: color
    default: '#120d11'
  - name: bone
    label: Fondo claro y texto (crema)
    widget: color
    default: '#f4eee6'
  - name: lacquer
    label: Rojo laca (botones, cinta)
    widget: color
    default: '#e8004f'
  - name: bubble
    label: Rosa (detalles)
    widget: color
    default: '#ff8fc7'
  - name: body_font
    label: Letra del texto
    widget: select
    default: Instrument Sans
    dropdown_threshold: 12
    options:
    - Instrument Sans
    - Bricolage Grotesque
    - system-ui
    hint: Servidas desde la propia web (sin Google). Los títulos siguen en Instrument Serif / Bricolage.
- name: about
  label: 'Sobre mí: fotos'
  icon: face
  file: content/about.json
  fields:
  - name: _about
    label: Nota (no tocar)
    widget: hidden
    default: Photos of the 'about' section.
  - name: portrait
    label: Retrato grande (arco)
    widget: image
    media_folder: /source-images
    public_folder: /source-images
    required: true
    hint: Vertical. Se muestra entero, sin recortar.
  - name: images
    label: Tira de fotos
    widget: list
    collapsed: true
    thumbnail: file
    summary: '{{fields.file}}'
    label_singular: foto
    hint: 4 fotos verticales, en orden.
    fields:
    - name: file
      label: Foto
      widget: image
      media_folder: /source-images
      public_folder: /source-images
      required: true
    - &id001
      name: o
      label: Forma
      widget: select
      default: p
      options:
      - label: Vertical
        value: p
      - label: Horizontal
        value: l
      dropdown_threshold: 12
- name: photos
  label: Créditos de las fotos
  icon: copyright
  file: content/photos.json
  fields:
  - name: _about
    label: Nota (no tocar)
    widget: hidden
    default: 'Every photo in source-images/ (original, never cropped) is published as img/sm/<name>.jpg (820 px) and img/lg/<name>.jpg (1800 px). Use the name without .jpg in shows → images. Credits: name
      → photographer.'
  - name: camera_files
    label: Nombre original de cada foto (no tocar)
    widget: keyvalue
    required: false
  - name: credits
    label: Fotógrafa/o de cada foto
    widget: keyvalue
    required: false
    hint: 'Izquierda: nombre de la foto sin .jpg (p. ej. circografia-1). Derecha: quién la hizo.'
