- name: shows
  label: Espectáculos
  icon: theater_comedy
  files:
  - name: list
    label: Espectáculos
    file: content/shows.json
    fields:
    - name: _about
      label: Nota (no tocar)
      widget: hidden
      default: 'Shows: titles, video, credits, supporters, photos (texts per language are in content/i18n/<lang>.json → shows.<id>).'
    - name: shows
      label: Espectáculos
      widget: list
      collapsed: true
      summary: '{{fields.title}}'
      label_singular: espectáculo
      hint: En orden (el primero sale primero). Los textos de cada uno (descripción, estado…) están en Textos → Espectáculos.
      fields:
      - name: id
        label: Código (no tocar)
        widget: string
        hint: Une este espectáculo con sus textos en cada idioma.
      - name: title
        label: Título
        widget: string
      - name: video
        label: Vídeo (enlace PeerTube o YouTube)
        widget: string
        hint: 'Pega el enlace normal del vídeo: PeerTube (https://…/w/…) o YouTube. PeerTube mejor (sin Google).'
      - name: video_cover
        label: Foto de portada del vídeo
        widget: image
        media_folder: /source-images
        public_folder: /source-images
        required: true
      - name: download
        label: Dossier (botón)
        widget: select
        required: false
        dropdown_threshold: 12
        options:
        - invocaciones
        - invocaciones-compacto
        hint: Qué PDF da el botón «Dossier» de este espectáculo.
      - name: credits
        label: Ficha artística
        widget: list
        collapsed: true
        summary: '{{fields.name}}'
        label_singular: crédito
        fields:
        - name: role
          label: Rol
          widget: select
          options:
          - label: Idea y dirección
            value: idea
          - label: Mirada externa
            value: outside_eye
          - label: Banda sonora
            value: music
          - label: Acompañamiento artístico
            value: artistic_support
          - label: Imagen
            value: image
          - label: Diseño de iluminación
            value: lighting
          - label: Videoarte
            value: video_art
          - label: Vestuario
            value: costume
          dropdown_threshold: 12
          hint: Los nombres de los roles están en Textos → Ficha artística.
        - name: name
          label: Nombre
          widget: string
        - name: url
          label: Enlace (opcional)
          widget: string
          required: false
      - name: support
        label: Con el apoyo de
        widget: list
        hint: Un nombre por línea.
      - name: images
        label: Galería
        widget: list
        collapsed: true
        thumbnail: file
        summary: '{{fields.file}}'
        label_singular: foto
        hint: 'En orden: forman el mosaico. Las fotos nunca se recortan.'
        fields:
        - name: file
          label: Foto
          widget: image
          media_folder: /source-images
          public_folder: /source-images
          required: true
        - *id001
